name: Cache build dir
description: >
  Restore the cached build dir and rebuild every file changed since the commit it was built from.
  git-restore-mtime alone misses files that a rebase or force-push brings in with an older commit time.

inputs:
  key:
    description: Cache key
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache@v5.0.5
      with:
        key: ${{ inputs.key }}
        path: |
          build
          .cache_head
    - shell: bash
      run: |
        if [ -f .cache_head ] && git cat-file -e "$(cat .cache_head)^{commit}" 2>/dev/null; then
          git diff --name-only "$(cat .cache_head)" HEAD | while read -r f; do
            if [ -f "$f" ]; then touch "$f"; fi
          done
        elif [ -d build ]; then
          echo "Cached build of unknown commit: starting from scratch"
          sudo rm -rf build
        fi
        git rev-parse HEAD > .cache_head
