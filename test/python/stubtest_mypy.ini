[mypy]
ignore_missing_imports = True
# Only real modules: without this mypy walks every subdirectory of the
# package as a namespace package, including the shipped include/ tree
# (which on macOS contains a symlinked directory cycle -> endless walk).
namespace_packages = False

# casadi.pyi: narrowest-first overloads (overload-overlap) and self-typed
# overloads declared on the shared base class (misc) are by design.
[mypy-casadi.casadi]
disable_error_code = overload-overlap, misc, override

# Untyped runtime helpers shipped inside the package; not part of the stub.
[mypy-casadi.tools.*]
ignore_errors = True
[mypy-casadi.tools]
ignore_errors = True
